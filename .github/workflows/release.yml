name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: derive version and artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Detected version: ${VERSION}"
          FABRIC_MC=$(grep '^minecraft_version=' fabric/gradle.properties | cut -d'=' -f2)
          NEOFORGE_MC=$(grep '^minecraft_version=' neoforge/gradle.properties | cut -d'=' -f2)
          # Resolve built runtime jars (exclude sources)
          FABRIC_FILE=$(ls -t fabric/build/libs/*fabric*.jar | grep -v sources | head -n 1)
          NEOFORGE_FILE=$(ls -t neoforge/build/libs/*neoforge*.jar | grep -v sources | head -n 1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "fabric_mc=${FABRIC_MC}" >> "$GITHUB_OUTPUT"
          echo "neoforge_mc=${NEOFORGE_MC}" >> "$GITHUB_OUTPUT"
          echo "fabric_file=${FABRIC_FILE}" >> "$GITHUB_OUTPUT"
          echo "neoforge_file=${NEOFORGE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Modrinth Publish (Fabric)
        uses: cloudnode-pro/modrinth-publish@v2.1.4
        with:
          token: ${{ secrets.MODRINTH_UPLOAD }}
          project: fWWnGrTh
          name: "[${{ steps.meta.outputs.version }}] HardcorePlus+ Fabric ${{ steps.meta.outputs.fabric_mc }}"
          version: ${{ steps.meta.outputs.version }}-fabric
          changelog: See GitHub release notes for v${{ steps.meta.outputs.version }} → https://github.com/${{ github.repository }}/releases/tag/v${{ steps.meta.outputs.version }}
          loaders: |-
            fabric
          game-versions: ${{ steps.meta.outputs.fabric_mc }}
          files: ${{ steps.meta.outputs.fabric_file }}
          dependencies: |-
            [
              {"project_id": "P7dR8mSH", "dependency_type": "required"}
            ]

      - name: Modrinth Publish (NeoForge)
        uses: cloudnode-pro/modrinth-publish@v2.1.4
        with:
          token: ${{ secrets.MODRINTH_UPLOAD }}
          project: fWWnGrTh
          name: "[${{ steps.meta.outputs.version }}] HardcorePlus+ NeoForge ${{ steps.meta.outputs.neoforge_mc }}"
          version: ${{ steps.meta.outputs.version }}-neoforge
          changelog: See GitHub release notes for v${{ steps.meta.outputs.version }} → https://github.com/${{ github.repository }}/releases/tag/v${{ steps.meta.outputs.version }}
          loaders: |-
            neoforge
          game-versions: ${{ steps.meta.outputs.neoforge_mc }}
          files: ${{ steps.meta.outputs.neoforge_file }}

      - name: create GitHub release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.meta.outputs.fabric_file }}
            ${{ steps.meta.outputs.neoforge_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
