plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// Name jars using: HardcorePlus+-{mod_version}+{minecraft_version}.jar
// Example: HardcorePlus+-1.2.0-fabric+1.21.1.jar
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

// Use a readable display name for the archive base (avoid spaces in filenames)
base { archivesName = 'HardcorePlus+' }

repositories { }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile against common and embed it so the Fabric jar is self-contained
    implementation project(":common")
    include project(":common")
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "hardcoreplus" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") { rename { "${it}_${inputs.properties.archivesName}" } }
}

publishing {
    publications { create("mavenJava", MavenPublication) { artifactId = project.archives_base_name; from components.java } }
    repositories { }
}
